<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <link rel="stylesheet" href="css/chat.css">

</head>
<body>

    <div id="opening">

    <div class="heart"></div>

    <div class="opening-text">
        Connecting to tiara...
    </div>

    <div class="loader">

        <span></span>
        <span></span>
        <span></span>

    </div>

</div>

    <div class="chat-window">

        <!-- HEADER -->

        <div class="chat-header">

            <img src="images/avatar.jpe" class="avatar">

            <div class="info">

                <div class="name">
                    tiara
                </div>

                <div class="status" id="status">
                    Online
                </div>

            </div>

        </div>

        <!-- CHAT -->

        <div class="chat-area" id="chatArea">

            <!-- Semua chat dibuat lewat JavaScript -->

        </div>

        <!-- FOOTER -->

        <div class="footer">

            <button id="next">
                Next
            </button>

        </div>

    </div>

    <script src="js/chat.js"></script>

</body>
</html>
